# Dev only (Brief P5: dev = docker compose). Không dùng cho staging/production.
# Chạy từ thư mục gốc repo: pnpm dev:infra  (cần file .env, xem README).
name: gani-platform-chat

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong .env (cp .env.example .env)}
      POSTGRES_DB: gani_platform
      # Mật khẩu 3 role DB, đọc bởi infra/db/bootstrap-roles.sql lần khởi động đầu (volume rỗng).
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:?Đặt APP_ROLE_PASSWORD trong .env}
      AUTH_ROLE_PASSWORD: ${AUTH_ROLE_PASSWORD:?Đặt AUTH_ROLE_PASSWORD trong .env}
      MIGRATION_ROLE_PASSWORD: ${MIGRATION_ROLE_PASSWORD:?Đặt MIGRATION_ROLE_PASSWORD trong .env}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/bootstrap-roles.sql:/bootstrap/bootstrap-roles.sql:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gani_platform']
      interval: 5s
      timeout: 3s
      retries: 10

  # Valkey thay Redis 7 vì giấy phép (xem QUESTIONS.md); AOF bật theo Brief P5.
  cache:
    image: valkey/valkey:8.0-alpine
    command: ['valkey-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - cachedata:/data
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # giao diện xem thư

volumes:
  pgdata:
  cachedata:
