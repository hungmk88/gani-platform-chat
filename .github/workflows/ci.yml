name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  GITLEAKS_VERSION: '8.30.1'
  # SHA256 của gitleaks_<version>_linux_x64.tar.gz, lấy từ gitleaks_<version>_checksums.txt của bản phát hành.
  # Đổi phiên bản thì phải đổi cả hai dòng này.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  verify:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action ghim theo SHA commit (chú thích là tag tương ứng).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Phiên bản pnpm lấy từ "packageManager" trong package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  security:
    name: dependency audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quét toàn bộ lịch sử: secret đã lỡ commit rồi xóa vẫn nằm trong git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Chặn CVE HIGH/CRITICAL (quy tắc dự án).
      - run: pnpm audit --audit-level=high
      # Dùng file nhị phân gitleaks (MIT) thay vì gitleaks-action (cần license key với repo thuộc organization).
      - name: Install gitleaks
        run: |
          curl -sSfL --max-time 60 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # --redact: không in giá trị secret ra log CI.
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --no-banner .
