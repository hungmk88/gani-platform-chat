name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run by hand on any branch (Actions -> CI -> Run workflow). It is how a mutation test of the kill-tests runs on a temporary branch
  # without a pull request, so that no Merge button exists for it (N99: GitHub Free enforces no branch protection, N38).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  GITLEAKS_VERSION: '8.30.1'
  # SHA256 của gitleaks_<version>_linux_x64.tar.gz, lấy từ gitleaks_<version>_checksums.txt của bản phát hành.
  # Đổi phiên bản thì phải đổi cả hai dòng này.
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  verify:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action ghim theo SHA commit (chú thích là tag tương ứng).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Phiên bản pnpm lấy từ "packageManager" trong package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Build first: typed ESLint reads the types of workspace packages from their dist/.
      - run: pnpm build
      # Start the built API once: tsc and vitest read .ts, so only a real process finds an import that Node cannot load (review A-01).
      - run: pnpm --filter @gani/api smoke
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm --filter @gani/db lint:migrations
      # The types of the admin are generated from the OpenAPI of the API (served and planned, N167): a change to one without the
      # other fails here.
      - name: Admin API types match docs/openapi/openapi.json and planned.json
        run: |
          pnpm --filter @gani/admin gen:api
          git diff --exit-code -- apps/admin/src/api/schema.d.ts apps/admin/src/api/planned.d.ts

  # The admin as a person uses it: the built app in Chromium against apps/admin/e2e/stub-api.ts, axe-core on every screen
  # (apps/admin/CLAUDE.md "CI bắt buộc"). No database: the stub answers /api/auth and /v1.
  admin-e2e:
    name: admin (e2e, axe)
    # Pinned, not ubuntu-latest (#350, CEO 27/10): the image changes only on purpose, so a library Chromium misses shows at once.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "@gani/admin..." build
      # The Chromium of the pinned @playwright/test, cached by the runner image and that version (#350): `runner.os` alone is
      # "Linux", so the key also takes `ImageOS` (ubuntu24, ubuntu26…), a Chromium built for another image is never reused.
      # No apt (`playwright install-deps` / `--with-deps`): it took 13 s, then 13 min on the same image and commit (#362), a slow
      # mirror. The image ships Google Chrome, so Chromium's libraries are there. Moving to a new image and a library is missing:
      # E2E fails when the browser starts; install that one package here, not `install-deps` as a whole.
      # pipefail and the empty checks: a failed lookup must stop here, never become a key shared by every version (CLAUDE.md).
      - id: playwright-key
        shell: bash
        run: |
          v="$(pnpm --filter @gani/admin exec playwright --version | awk '{print $2}')"
          test -n "$v"
          test -n "${ImageOS:-}"
          echo "image=${ImageOS}" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "::notice title=Playwright cache key::image=${ImageOS} imageVersion=${ImageVersion:-?} playwright=$v"
      - id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # v2: the first cache made without apt (#362); bump it to start the cache afresh.
          key: v2-${{ runner.os }}-${{ steps.playwright-key.outputs.image }}-playwright-${{ steps.playwright-key.outputs.version }}-chromium
      - name: Playwright Chromium (only on a cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @gani/admin exec playwright install chromium
      - run: |
          echo "::notice title=Playwright cache::hit=${{ steps.playwright-cache.outputs.cache-hit || 'false' }}"
          pnpm --filter @gani/admin e2e
      # The widget on its test page (apps/widget/CLAUDE.md "Kiểm chứng"), with the same Chromium: built, then E2E and axe-core.
      - run: pnpm --filter @gani/widget build
      - run: pnpm --filter @gani/widget e2e

  security:
    name: dependency audit, secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Quét toàn bộ lịch sử: secret đã lỡ commit rồi xóa vẫn nằm trong git history.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # Chặn CVE HIGH/CRITICAL (quy tắc dự án).
      - run: pnpm audit --audit-level=high
      # Dùng file nhị phân gitleaks (MIT) thay vì gitleaks-action (cần license key với repo thuộc organization).
      - name: Install gitleaks
        run: |
          curl -sSfL --max-time 60 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # --redact: không in giá trị secret ra log CI.
      - name: Scan git history for secrets
        run: ./gitleaks git --redact --verbose --no-banner .

  db:
    name: database (roles, migrations, RLS tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PG_IMAGE: pgvector/pgvector:0.8.7-pg16
      PG_DB: gani_platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Throwaway passwords, new on every run, masked in the log and never stored.
      - name: Generate passwords
        run: |
          for name in POSTGRES APP_ROLE AUTH_ROLE MIGRATION_ROLE SUPPORT_TEST_LOGIN; do
            password="$(openssl rand -hex 24)"
            echo "::add-mask::${password}"
            echo "${name}_PASSWORD=${password}" >> "$GITHUB_ENV"
          done
      # `docker run` instead of `services:` so the superuser password can be generated above.
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD -e POSTGRES_DB="$PG_DB" -p 127.0.0.1:5432:5432 "$PG_IMAGE"
          # -h 127.0.0.1: the temporary server of the image's first start listens on the socket only.
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d "$PG_DB" && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Bootstrap roles
        run: |
          docker exec -i -e APP_ROLE_PASSWORD -e AUTH_ROLE_PASSWORD -e MIGRATION_ROLE_PASSWORD pg             psql -v ON_ERROR_STOP=1 -U postgres -d "$PG_DB" < infra/db/bootstrap-roles.sql
      # CI-only login for the support_role tests; the password is generated above and never printed.
      - name: Create CI support login
        run: |
          docker exec -i -e SUPPORT_TEST_LOGIN_PASSWORD pg psql -v ON_ERROR_STOP=1 -U postgres -d "$PG_DB" < infra/db/ci-support-login.sql
      - name: Migrate and run database tests
        run: |
          base="127.0.0.1:5432/${PG_DB}"
          export DATABASE_URL_APP="postgres://app_role:${APP_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_AUTH="postgres://auth_role:${AUTH_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_MIGRATION="postgres://migration_role:${MIGRATION_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_SUPPORT="postgres://support_test_login:${SUPPORT_TEST_LOGIN_PASSWORD}@${base}"
          # The tests import the workspace packages the API depends on, which export their dist/: build them first (A-01, N138).
          # The API itself too: the test of the bootstrap script runs it, and it loads the built API (N148).
          pnpm --filter "@gani/api..." build
          pnpm --filter @gani/db migrate
          pnpm --filter @gani/db test:integration
          # Better Auth on the real adapter as auth_role (N79); reuses this job's PostgreSQL. Split it into its own job if it adds > 30 s.
          pnpm --filter @gani/api test:integration
      - name: PostgreSQL log
        if: failure()
        run: docker logs pg 2>&1 | tail -n 60

  # The queue, on a real Valkey and a real PostgreSQL (outbox spec §10, N40). Separate from `db` on purpose: it stops and starts the
  # servers and kills worker processes, which no database test may see. The PostgreSQL steps are repeated from the `db` job, not
  # shared: "Lặp với job db; xem PR rút gọn composite action sau".
  queue:
    name: queue (BullMQ on Valkey, kill-tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PG_IMAGE: pgvector/pgvector:0.8.7-pg16
      PG_DB: gani_platform
      VALKEY_IMAGE: valkey/valkey:8.0-alpine
      VALKEY_CONTAINER: valkey
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # --- PostgreSQL: the same steps as the `db` job (without the support login, which no queue test uses) ---
      - name: Generate passwords
        run: |
          for name in POSTGRES APP_ROLE AUTH_ROLE MIGRATION_ROLE; do
            password="$(openssl rand -hex 24)"
            echo "::add-mask::${password}"
            echo "${name}_PASSWORD=${password}" >> "$GITHUB_ENV"
          done
      - name: Start PostgreSQL
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD -e POSTGRES_DB="$PG_DB" -p 127.0.0.1:5432:5432 "$PG_IMAGE"
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d "$PG_DB" && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Bootstrap roles
        run: |
          docker exec -i -e APP_ROLE_PASSWORD -e AUTH_ROLE_PASSWORD -e MIGRATION_ROLE_PASSWORD pg psql -v ON_ERROR_STOP=1 -U postgres -d "$PG_DB" < infra/db/bootstrap-roles.sql
      # --- Valkey: same image and flags as infra/docker/docker-compose.yml. No password: the runner is thrown away and the port is
      # bound to 127.0.0.1. The name is fixed because the tests stop and start the container with `docker stop|start`. ---
      - name: Start Valkey
        run: |
          docker run -d --name "$VALKEY_CONTAINER" -p 127.0.0.1:6379:6379 "$VALKEY_IMAGE"             valkey-server --appendonly yes --maxmemory-policy noeviction
          for _ in $(seq 1 30); do
            docker exec "$VALKEY_CONTAINER" valkey-cli ping | grep -q PONG && exit 0
            sleep 2
          done
          echo "Valkey did not become ready" >&2
          exit 1
      # For the record of N40: which server it is, and that the AOF and the memory policy are what BullMQ asks for.
      - name: Show the Valkey settings
        run: |
          docker exec "$VALKEY_CONTAINER" valkey-cli INFO server | grep -E '^(redis_version|valkey_version):' || true
          docker exec "$VALKEY_CONTAINER" valkey-cli CONFIG GET appendonly
          docker exec "$VALKEY_CONTAINER" valkey-cli CONFIG GET maxmemory-policy
      # The kill-tests run `node dist/main.js` as a real process, so the worker and what it imports must be built. The end-to-end test
      # of realtime (webhook -> worker -> socket, V8c) also runs the API's `dist/main.js`.
      - name: Build the worker and the API
        run: pnpm --filter "@gani/worker..." --filter "@gani/api..." build
      - name: Migrate and run the queue tests
        run: |
          base="127.0.0.1:5432/${PG_DB}"
          export DATABASE_URL_APP="postgres://app_role:${APP_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_AUTH="postgres://auth_role:${AUTH_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_MIGRATION="postgres://migration_role:${MIGRATION_ROLE_PASSWORD}@${base}"
          pnpm --filter @gani/db migrate
          pnpm --filter @gani/worker test:integration
      - name: Logs of the servers
        if: failure()
        run: |
          docker logs pg 2>&1 | tail -n 60
          docker logs "$VALKEY_CONTAINER" 2>&1 | tail -n 60

  # The images of infra/docker (infra/CLAUDE.md "Docker"): gani-api, gani-worker, gani-migrate, gani-admin, linux/amd64, tagged with
  # the commit (never `latest`) and not pushed (no registry before Q2). infra/docker/test-images.sh then checks them against a real
  # PostgreSQL and Valkey: size, user, contents, fail-fast, migrations, probes, HEALTHCHECK, Socket.IO, `docker stop`, Trivy.
  # If an image is over 100 MB compressed (or 400 MB uncompressed), investigate; over 150 MB compressed, fix before merge. Common
  # causes: devDependencies in the runtime, unnecessary files copied, large native modules.
  docker:
    name: docker images (build, size, run, scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PG_IMAGE: pgvector/pgvector:0.8.7-pg16
      PG_DB: gani_platform
      VALKEY_IMAGE: valkey/valkey:8.0-alpine
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --- PostgreSQL and Valkey: the same steps as the `queue` job. ---
      - name: Generate passwords
        run: |
          for name in POSTGRES APP_ROLE AUTH_ROLE MIGRATION_ROLE; do
            password="$(openssl rand -hex 24)"
            echo "::add-mask::${password}"
            echo "${name}_PASSWORD=${password}" >> "$GITHUB_ENV"
          done
      - name: Start PostgreSQL and Valkey
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD -e POSTGRES_DB="$PG_DB" -p 127.0.0.1:5432:5432 "$PG_IMAGE"
          docker run -d --name valkey -p 127.0.0.1:6379:6379 "$VALKEY_IMAGE" valkey-server --appendonly yes --maxmemory-policy noeviction
          for _ in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres -d "$PG_DB" && docker exec valkey valkey-cli ping | grep -q PONG && exit 0
            sleep 2
          done
          echo "PostgreSQL or Valkey did not become ready" >&2
          exit 1
      - name: Bootstrap roles
        run: |
          docker exec -i -e APP_ROLE_PASSWORD -e AUTH_ROLE_PASSWORD -e MIGRATION_ROLE_PASSWORD pg psql -v ON_ERROR_STOP=1 -U postgres -d "$PG_DB" < infra/db/bootstrap-roles.sql
      # BuildKit layer cache, one folder per image, kept by the pinned actions/cache (as the Playwright cache of `admin-e2e`).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/buildx-cache
          key: docker-${{ hashFiles('pnpm-lock.yaml', 'infra/docker/Dockerfile.*') }}-${{ github.sha }}
          restore-keys: |
            docker-${{ hashFiles('pnpm-lock.yaml', 'infra/docker/Dockerfile.*') }}-
            docker-
      - name: Build the images
        run: |
          docker buildx create --use --driver docker-container --name gani
          build() {
            docker buildx build --load --platform linux/amd64 --cache-from "type=local,src=/tmp/buildx-cache/$1" \
              --cache-to "type=local,dest=/tmp/buildx-cache-new/$1,mode=max" -t "gani-$1:$TAG" "${@:2}" .
          }
          for target in api worker migrate; do build "$target" -f infra/docker/Dockerfile.node --target "$target"; done
          build admin -f infra/docker/Dockerfile.admin
          rm -rf /tmp/buildx-cache && mv /tmp/buildx-cache-new /tmp/buildx-cache
      - name: Check the images
        run: |
          base="127.0.0.1:5432/${PG_DB}"
          export DATABASE_URL_APP="postgres://app_role:${APP_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_AUTH="postgres://auth_role:${AUTH_ROLE_PASSWORD}@${base}"
          export DATABASE_URL_MIGRATION="postgres://migration_role:${MIGRATION_ROLE_PASSWORD}@${base}"
          export REDIS_URL=redis://127.0.0.1:6379
          infra/docker/test-images.sh "$TAG"

  # The Terraform skeleton (infra/CLAUDE.md "Terraform"): format, then each environment validated without a backend, then the
  # platform switch of modules/database. No plan, no apply: no provider until Q2. The binary is the version of
  # infra/terraform/.terraform-version, checked against infra/terraform/terraform.sha256 (from HashiCorp's signed SHA256SUMS).
  terraform:
    name: terraform (fmt, validate, test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Terraform (pinned, checksum verified)
        run: |
          version="$(cat infra/terraform/.terraform-version)"
          file="terraform_${version}_linux_amd64.zip"
          curl -sSfL -o "$RUNNER_TEMP/$file" "https://releases.hashicorp.com/terraform/${version}/${file}"
          (cd "$RUNNER_TEMP" && grep "  ${file}\$" "$GITHUB_WORKSPACE/infra/terraform/terraform.sha256" | sha256sum --check --strict)
          unzip -q "$RUNNER_TEMP/$file" -d "$RUNNER_TEMP/terraform"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"
      # Before init: a format error fails in seconds.
      - name: Format
        run: terraform -chdir=infra/terraform fmt -check -recursive
      - name: Validate the environments
        run: |
          for env in staging production; do
            terraform -chdir="infra/terraform/envs/$env" init -backend=false -input=false
            terraform -chdir="infra/terraform/envs/$env" validate
          done
      - name: Test the platform switch
        run: |
          terraform -chdir=infra/terraform/modules/database init -input=false
          terraform -chdir=infra/terraform/modules/database test
